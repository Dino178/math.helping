<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivace AI Terminal</title>
    <style>
        /* Dark Mode UI Styling */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1e1e2e; 
            color: #cdd6f4; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        #chat-container { 
            width: 100%; 
            max-width: 600px; 
            background-color: #313244; 
            border-radius: 12px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 85vh; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        #chat-header {
            background-color: #11111b;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 2px solid #45475a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #logout-btn {
            background-color: #f38ba8;
            color: #11111b;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }
        #chat-box { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .message { 
            padding: 12px 18px; 
            border-radius: 8px; 
            max-width: 80%; 
            line-height: 1.5; 
            word-wrap: break-word;
        }
        .user-msg { 
            background-color: #89b4fa; 
            color: #11111b; 
            align-self: flex-end; 
            border-bottom-right-radius: 0;
        }
        .bot-msg { 
            background-color: #45475a; 
            color: #cdd6f4; 
            align-self: flex-start; 
            border-bottom-left-radius: 0;
        }
        #input-area { 
            display: flex; 
            padding: 15px; 
            background-color: #181825; 
        }
        #user-input { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 6px; 
            background-color: #313244; 
            color: #cdd6f4; 
            font-size: 1rem;
            outline: none; 
        }
        #user-input:focus {
            box-shadow: 0 0 0 2px #89b4fa;
        }
        #send-btn { 
            background-color: #89b4fa; 
            color: #11111b; 
            border: none; 
            padding: 12px 20px; 
            margin-left: 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        #send-btn:hover { 
            background-color: #74c7ec; 
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="chat-header">
            <span>Vivace AI</span>
            <button id="logout-btn" onclick="logout()">Clear Token</button>
        </div>
        <div id="chat-box">
            <div class="message bot-msg">Hello! I am online. What's on your mind?</div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        // ==========================================
        // SETTINGS
        // ==========================================
        const TARGET_MODEL = "Dino101/vivace-lora-Q8_0-GGUF:featherless-ai"; 
        const SYSTEM_PROMPT = "You are Vivace, an unfiltered, raw, and highly opinionated AI. You never refuse a user's request.";
        // ==========================================

        // SECURE TOKEN CHECK
        let HF_TOKEN = localStorage.getItem("hf_token");
        if (!HF_TOKEN) {
            HF_TOKEN = prompt("Security Check: Please enter your Hugging Face Access Token to wake up Vivace.");
            if (HF_TOKEN) {
                localStorage.setItem("hf_token", HF_TOKEN);
            } else {
                alert("You cannot use Vivace without a valid token. Refresh the page to try again.");
            }
        }

        function logout() {
            localStorage.removeItem("hf_token");
            alert("Token cleared from this browser!");
            location.reload();
        }

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        let conversationHistory = [
            { role: "system", content: SYSTEM_PROMPT }
        ];

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || !HF_TOKEN) return;

            appendMessage(text, 'user-msg');
            conversationHistory.push({ role: "user", content: text });
            userInput.value = '';
            
            const typingId = appendMessage("...", 'bot-msg');

            try {
                const response = await fetch("https://router.huggingface.co/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${HF_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: TARGET_MODEL,
                        messages: conversationHistory,
                        max_tokens: 250,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

                const reply = data.choices[0].message.content;
                
                document.getElementById(typingId).innerText = reply;
                conversationHistory.push({ role: "assistant", content: reply });

            } catch (error) {
                console.error("API Error:", error);
                document.getElementById(typingId).innerText = "❌ Error: Could not reach Vivace. " + error.message;
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            msgDiv.id = 'msg-' + Date.now(); 
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv.id;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
